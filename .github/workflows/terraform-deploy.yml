# =============================================================================
# Production Terraform workflow: GCP infra via Workload Identity Federation
# =============================================================================
# - PR: fmt check, validate, init, plan (per environment). No apply.
# - Push to main: terraform apply per environment (dev, qa, prod) with remote state.
# - Auth: OIDC (no long-lived keys). State: GCS, one bucket, prefix per env.
#
# GCP setup required (one-time):
#   1. Create a GCP Service Account with roles: Storage Admin (state bucket),
#      plus any roles needed for Terraform resources (e.g. Editor or granular).
#   2. Enable Workload Identity Federation: IAM > Workload Identity Federation
#      > Add pool (e.g. "github-pool") > Add provider (OIDC, issuer
#      https://token.actions.githubusercontent.com, attribute mapping as needed).
#   3. Grant the SA to the provider: "Principal Set" on the pool/provider
#      (e.g. principal://.../attribute.repository/YOUR_ORG/YOUR_REPO) with
#      role "Workload Identity User" and the service account as member.
#   4. Create a GCS bucket for Terraform state (e.g. your-project-tfstate).
#
# GitHub secrets required:
#   WIF_PROVIDER          = projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
#   WIF_SERVICE_ACCOUNT   = terraform-ci@YOUR_PROJECT.iam.gserviceaccount.com
#   TF_STATE_BUCKET       = your-tfstate-bucket-name
# =============================================================================

name: Terraform Deploy (GCP)

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to apply (leave empty to apply all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - dev
          - qa
          - prod

env:
  TERRAFORM_VERSION: '1.5.0'

jobs:
  # ---------------------------------------------------------------------------
  # On PR: validate and plan for each environment. No apply.
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: Plan (${{ matrix.environment }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, qa, prod]
    defaults:
      run:
        working-directory: terraform

    permissions:
      contents: read
      id-token: write   # Required for OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt (check)
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Terraform init (remote state per environment)
        id: init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ matrix.environment }}"

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan-${{ matrix.environment }} \
            -var-file="${{ matrix.environment }}.tfvars"

      - name: Upload plan artifact (optional; for review)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: terraform/tfplan-${{ matrix.environment }}

  # ---------------------------------------------------------------------------
  # On push to main: apply per environment. Idempotent; uses plan from PR or
  # runs plan inline before apply when triggered by push or workflow_dispatch.
  # ---------------------------------------------------------------------------
  terraform-apply:
    name: Apply (${{ matrix.environment }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # On workflow_dispatch with env selected: single env; else all three.
        environment: ${{ fromJSON(github.event_name == 'workflow_dispatch' && github.event.inputs.environment != '' && format('["{0}"]', github.event.inputs.environment) || '["dev","qa","prod"]') }}
    defaults:
      run:
        working-directory: terraform

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (remote state per environment)
        id: init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ matrix.environment }}"

      - name: Terraform plan (for apply run)
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var-file="${{ matrix.environment }}.tfvars"

      - name: Terraform apply
        id: apply
        run: terraform apply -input=false -auto-approve tfplan
