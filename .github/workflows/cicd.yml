name: ML Pipeline & Deploy (CI/CD)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  pipeline:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ML-code/requirements.txt

      - run: pip install -r ML-code/requirements.txt

      - name: Run ML pipeline
        run: python ML-code/run_pipeline.py
        env:
          GCP_PROJECT:      ${{ secrets.GCP_PROJECT }}
          DATA_BUCKET:      ${{ secrets.DATA_BUCKET }}
          ARTIFACTS_BUCKET: ${{ secrets.ARTIFACTS_BUCKET }}
          DATASET_ID:       ${{ secrets.DATASET_ID }}
          TABLE_ID:         ${{ secrets.TABLE_ID }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ML-code/requirements.txt

      - run: pip install -r ML-code/requirements.txt
      - run: python -m pytest tests/ -v

  deploy:
    needs: [pipeline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          REPO="asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/mlapp-dev-repo"
          IMG="$REPO/app:${{ github.sha }}"
          echo "Building $IMG"
          docker build -t "$IMG" .
          docker push "$IMG"
          echo "IMAGE=$IMG" >> $GITHUB_ENV

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy app \
            --image "${{ env.IMAGE }}" \
            --region "asia-south1" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "mlapp-dev-runtime@sabs-1000.iam.gserviceaccount.com" \
            --set-env-vars "GCP_PROJECT=${{ secrets.GCP_PROJECT }},ARTIFACTS_BUCKET=${{ secrets.ARTIFACTS_BUCKET }}"
        env:
          CLOUDSDK_CORE_PROJECT: ${{ secrets.GCP_PROJECT }}