# ML Pipeline & Deploy: runs on every push to dev.
# Jobs: infra-env → pipeline + test (parallel) → deploy.

name: ML Pipeline & Deploy (CI/CD)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  infra-env:
    runs-on: ubuntu-latest
    outputs:
      project_id: ${{ steps.out.outputs.project_id }}
      region: ${{ steps.out.outputs.region }}
      data_bucket: ${{ steps.out.outputs.data_bucket }}
      artifacts_bucket: ${{ steps.out.outputs.artifacts_bucket }}
      dataset_id: ${{ steps.out.outputs.dataset_id }}
      table_id: ${{ steps.out.outputs.table_id }}
      artifact_repo_url: ${{ steps.out.outputs.artifact_repo_url }}
    steps:
      - id: out
        run: |
          echo "project_id=${{ secrets.GCP_PROJECT }}" >> $GITHUB_OUTPUT
          echo "region=asia-south1" >> $GITHUB_OUTPUT
          echo "data_bucket=${{ secrets.DATA_BUCKET }}" >> $GITHUB_OUTPUT
          echo "artifacts_bucket=${{ secrets.ARTIFACTS_BUCKET }}" >> $GITHUB_OUTPUT
          echo "dataset_id=${{ secrets.DATASET_ID }}" >> $GITHUB_OUTPUT
          echo "table_id=${{ secrets.TABLE_ID }}" >> $GITHUB_OUTPUT
          echo "artifact_repo_url=${{ secrets.ARTIFACT_REPO_URL }}" >> $GITHUB_OUTPUT

  pipeline:
    needs: infra-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ML-code/requirements.txt
      - run: pip install -r ML-code/requirements.txt
      - name: Run ML pipeline
        run: python ML-code/run_pipeline.py
        env:
          GCP_PROJECT: ${{ needs.infra-env.outputs.project_id }}
          DATA_BUCKET: ${{ needs.infra-env.outputs.data_bucket }}
          ARTIFACTS_BUCKET: ${{ needs.infra-env.outputs.artifacts_bucket }}
          DATASET_ID: ${{ needs.infra-env.outputs.dataset_id }}
          TABLE_ID: ${{ needs.infra-env.outputs.table_id }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ML-code/requirements.txt
      - run: pip install -r ML-code/requirements.txt
      - run: python -m pytest tests/ -v

  deploy:
    needs: [infra-env, pipeline, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Docker auth
        run: gcloud auth configure-docker ${{ needs.infra-env.outputs.artifact_repo_url }} --quiet
      - name: Build and push
        run: |
          IMG="${{ needs.infra-env.outputs.artifact_repo_url }}/app:${{ github.sha }}"
          docker build -t "$IMG" .
          docker push "$IMG"
          echo "IMAGE=$IMG" >> $GITHUB_ENV
      - name: Deploy Cloud Run
        run: |
          gcloud run deploy app \
            --image "${{ env.IMAGE }}" \
            --region "${{ needs.infra-env.outputs.region }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "GCP_PROJECT=${{ needs.infra-env.outputs.project_id }},ARTIFACTS_BUCKET=${{ needs.infra-env.outputs.artifacts_bucket }}"
        env:
          CLOUDSDK_CORE_PROJECT: ${{ needs.infra-env.outputs.project_id }}
